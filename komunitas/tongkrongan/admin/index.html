<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Tongkrongan | VespaKita</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --aspal:#15171A; --aspal-2:#1E2124; --krem:#F1E8D6; --krem-2:#E7DBC2;
    --merah:#C2272D; --merah-dark:#8F1B20; --mint:#6FA89A; --chrome:#A9A49B;
    --body: 'Work Sans', sans-serif; --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); background:var(--aspal); color:var(--krem); line-height:1.5; padding:32px 20px 80px;}
  img{max-width:100%; display:block;}
  .wrap{max-width:920px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:4px;}
  .sub{color:var(--chrome); font-size:13px; margin-bottom:28px;}

  #gate{max-width:360px; margin:80px auto; background:var(--aspal-2); border:1px solid rgba(241,232,214,0.12); border-radius:6px; padding:32px;}
  #gate input{width:100%; background:var(--aspal); color:var(--krem); border:1px solid rgba(241,232,214,0.18); border-radius:2px; padding:12px 40px 12px 14px; font-family:var(--body); font-size:14px; outline:none;}
  .gate-pass-wrap{position:relative; margin-bottom:14px;}
  #gate .gate-pass-toggle{position:absolute; top:0; right:0; height:100%; width:40px; background:none; border:none; color:var(--chrome); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  #gate .gate-pass-toggle:hover{color:var(--krem);}
  #gate button{width:100%; padding:13px; background:var(--merah); color:var(--krem); border:none; border-radius:2px; font-family:var(--mono); font-size:13px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;}
  #gate-error{color:var(--merah); font-size:12px; margin-top:10px; min-height:16px; text-align:center;}

  .item{background:var(--aspal-2); border:1px solid rgba(241,232,214,0.1); border-radius:6px; padding:18px 20px; margin-bottom:12px; display:flex; gap:16px;}
  .item-photo{width:80px; height:80px; object-fit:cover; border-radius:4px; background:var(--aspal); flex-shrink:0;}
  .item-body{flex:1; min-width:0;}
  .item-meta{font-family:var(--mono); font-size:11px; color:var(--chrome); margin-bottom:6px; text-transform:uppercase;}
  .item-text{font-size:14px; color:var(--krem); margin-bottom:12px;}
  .status-hidden{color:var(--merah); font-weight:700;}
  
  .item-actions{display:flex; flex-direction:column; gap:8px; flex-shrink:0; justify-content:center; min-width:140px;}
  .item-actions button{
    font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    padding:9px 14px; border-radius:2px; border:1px solid rgba(241,232,214,0.2); background:transparent; color:var(--krem); cursor:pointer; white-space:nowrap;
  }
  .btn-hide{border-color:var(--chrome) !important; color:var(--chrome) !important;}
  .btn-unhide{border-color:var(--krem) !important; color:var(--krem) !important;}
  .btn-delete{border-color:var(--merah) !important; color:var(--merah) !important;}
  .btn-delete:hover{background:var(--merah); color:#fff !important;}

  @media (max-width:640px){
    .item{flex-direction:column;}
    .item-actions{flex-direction:row; flex-wrap:wrap;}
    .item-actions button{flex:1;}
  }
</style>
</head>
<body>

<div id="gate">
  <h1 style="margin-bottom:18px;">Admin Tongkrongan</h1>
  <div class="gate-pass-wrap">
    <input type="password" id="gate-pass" placeholder="Password admin" onkeypress="if(event.key==='Enter') login()">
    <button type="button" class="gate-pass-toggle" id="gate-pass-toggle" aria-label="Tampilkan password">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
  <button id="gate-submit" onclick="login()">Masuk</button>
  <div id="gate-error"></div>
</div>

<div id="app" class="wrap" style="display:none;">
  <h1>Admin Tongkrongan</h1>
  <div class="sub">
    Moderasi Postingan Feed Global. <a href="../" style="color:var(--mint); text-decoration:underline;">&larr; Lihat Feed Publik</a>
  </div>
  <div id="posts-container">Memuat...</div>
</div>

<script>
  let pass = '';

  // Toggle Password
  const inputPass = document.getElementById('gate-pass');
  const btnToggle = document.getElementById('gate-pass-toggle');
  const eyeIcon = document.getElementById('eye-icon');
  btnToggle.addEventListener('click', () => {
    if(inputPass.type === 'password'){
      inputPass.type = 'text';
      eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    }else{
      inputPass.type = 'password';
      eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
  });

  function login() {
    pass = document.getElementById('gate-pass').value;
    if(!pass) return;
    
    // Simulate valid login visually (real validation happens on API)
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadPosts();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadPosts() {
    try {
      const res = await fetch('/api/tongkrongan-admin', { headers: { 'Authorization': 'Bearer ' + pass }});
      
      if(res.status === 401) { 
        document.getElementById('gate').style.display = 'block';
        document.getElementById('app').style.display = 'none';
        document.getElementById('gate-error').innerText = "Password Salah.";
        return; 
      }
      
      const data = await res.json();
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      
      if(!data.posts || data.posts.length === 0) {
        container.innerHTML = `<div style="color:var(--chrome); padding:20px; text-align:center; border:1px dashed rgba(255,255,255,0.1); border-radius:6px;">Belum ada postingan</div>`;
        return;
      }

      data.posts.forEach(p => {
        container.innerHTML += `
          <div class="item" style="opacity: ${p.status === 'hidden' ? 0.6 : 1}">
            ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" class="item-photo">` : ''}
            <div class="item-body">
              <div class="item-meta">
                <b style="color:var(--krem);">${escapeHtml(p.author_name)}</b> &bull; ${new Date(p.created_at).toLocaleString('id-ID')}
                ${p.parent_id ? ' <span style="color:var(--emas);">[REPLY]</span>' : ''}
                &bull; Status: <span class="${p.status === 'hidden' ? 'status-hidden' : ''}">${escapeHtml(p.status.toUpperCase())}</span>
              </div>
              <div class="item-text">${escapeHtml(p.content)}</div>
            </div>
            <div class="item-actions">
              ${p.status === 'visible' 
                ? `<button class="btn-hide" onclick="doAction('${escapeHtml(p.id)}', 'hide')">Turunkan</button>`
                : `<button class="btn-unhide" onclick="doAction('${escapeHtml(p.id)}', 'unhide')">Tampilkan</button>`
              }
              <button class="btn-delete" onclick="if(confirm('Yakin hapus permanen? Foto juga akan terhapus.')) doAction('${escapeHtml(p.id)}', 'delete')">Hapus Permanen</button>
            </div>
          </div>
        `;
      });
    } catch(e) {
      
  const mockData = [
    {
      id: "mock1", author_name: "Kang Vespa", created_at: new Date().toISOString(), status: "visible", content: "Wah mantap ini, ngumpul di senayan jam berapa besok?", image_url: "https://images.unsplash.com/photo-1579730040523-2895697669d0?auto=format&fit=crop&w=100&q=80"
    },
    {
      id: "mock2", parent_id: "mock1", author_name: "Budi PX", created_at: new Date().toISOString(), status: "hidden", content: "Komentar ini disembunyikan admin karena toxic."
    }
  ];
  
  let html = '<div style="background:rgba(212,175,55,0.1); color:var(--emas); padding:12px; border-radius:6px; margin-bottom:16px; font-size:12px; font-family:var(--mono);">[PREVIEW MODE] Data API tidak tersedia di Python Server. Ini adalah data dummy.</div>';
  
  mockData.forEach(p => {
    html += `<div class="item" style="opacity: ${p.status === 'hidden' ? 0.6 : 1}">
      ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" class="item-photo">` : ''}
      <div class="item-body">
        <div class="item-meta">
          <b style="color:var(--krem);">${escapeHtml(p.author_name)}</b> &bull; ${new Date(p.created_at).toLocaleString('id-ID')}
          ${p.parent_id ? ' <span style="color:var(--emas);">[REPLY]</span>' : ''}
          &bull; Status: <span class="${p.status === 'hidden' ? 'status-hidden' : ''}">${escapeHtml(p.status.toUpperCase())}</span>
        </div>
        <div class="item-text">${escapeHtml(p.content)}</div>
      </div>
      <div class="item-actions">
        ${p.status === 'visible' 
          ? `<button class="btn-hide" onclick="alert('Ini mode preview')">Turunkan</button>`
          : `<button class="btn-unhide" onclick="alert('Ini mode preview')">Tampilkan</button>`
        }
        <button class="btn-delete" onclick="alert('Ini mode preview')">Hapus Permanen</button>
      </div>
    </div>`;
  });
  
  document.getElementById('posts-container').innerHTML = html;

    }
  }

  async function doAction(id, action) {
    try {
      await fetch('/api/tongkrongan-admin', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + pass, 'content-type': 'application/json' },
        body: JSON.stringify({ id, action })
      });
      loadPosts();
    } catch(e) {
      alert("Local API tidak tersedia.");
    }
  }
</script>
</body>
</html>
